name: Bug report
description: Something isn't working as expected
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill this in so we can
        reproduce it quickly. For security issues, see SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: passcheck scored my password as "Weak" even though...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: I expected it to report "Strong".
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command(s) you ran.
      placeholder: |
        1. Run `passcheck "my password"`
        2. See output...
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: passcheck version
      description: Output of `passcheck --version` or the commit you're on.
    validations:
      required: false
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: "3.12.0"
    validations:
      required: true
