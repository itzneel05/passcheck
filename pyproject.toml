[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "passcheck"
version = "1.0.0"
description = "A tiny, dependency-free password strength checker CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "itzneel05" }]
keywords = ["password", "security", "strength", "cli"]

[project.scripts]
passcheck = "passcheck.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["passcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
